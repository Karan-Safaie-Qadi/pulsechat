[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsechat"
version = "1.0.0"
description = "Async TCP chat server with a bot engine for realistic traffic simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Karan Safaie Qadi" }]
keywords = ["chat", "socket", "asyncio", "bots", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
pulsechat = "pulsechat.cli:main"

[project.urls]
Homepage = "https://github.com/Karan-Safaie-Qadi/realtime-chat-server"

[tool.setuptools]
packages = ["pulsechat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
